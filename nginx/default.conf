server {
    listen 80;
    server_name winthedreamtrip.com www.winthedreamtrip.com test.winthedreamtrip.com;

    location /static/ {
        root /app;
    }

    location /media/ {
        root /app;
    }

    location / {
        proxy_pass http://web:8000;  # web = Django container name
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
